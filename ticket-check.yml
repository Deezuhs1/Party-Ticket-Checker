# Save this file as: .github/workflows/ticket-check.yml in a GitHub repo
#
# SETUP (5 minutes):
# 1. Create a free GitHub account if you don't have one, and a new
#    (can be private) repo, e.g. "sela-v-ticket-watch".
# 2. Add these two files to the repo:
#      check_tickets.py         (repo root)
#      .github/workflows/ticket-check.yml   (this file)
# 3. In the repo: Settings → Secrets and variables → Actions →
#    New repository secret → name it NTFY_TOPIC, value = your
#    ntfy.sh topic name (the random string you picked).
# 4. Install the "ntfy" app on your phone and subscribe to that same
#    topic name. That's it — GitHub will run the check automatically.
# 5. To confirm it works: go to the repo's "Actions" tab and click
#    "Run workflow" to trigger it manually once.

name: Check Sela V Reception Tickets

on:
  schedule:
    # Runs every 5 minutes. GitHub's actual free-tier scheduler can lag
    # a few minutes under load, but this is close to real-time.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}  # lets you trigger it manually from the Actions tab

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Run ticket check
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python check_tickets.py
